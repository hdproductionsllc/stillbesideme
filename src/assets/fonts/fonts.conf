<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for server-side SVG rendering (Sharp/librsvg).

  Points fontconfig at the vendored Cormorant Garamond files in this
  directory so the print/proof pipeline renders the exact typeface the
  customizer preview shows — on any host. Railway's containers ship no
  Georgia (the old fallback), so without this, production prints fell
  back to a generic serif. tributeRenderer.js sets FONTCONFIG_PATH to
  this directory before Sharp is first used.
-->
<fontconfig>
  <!-- prefix="relative" resolves against this file's directory, so the font
       dir and cache land here regardless of the process working directory. -->
  <dir prefix="relative">.</dir>
  <cachedir prefix="relative">cache</cachedir>
</fontconfig>
