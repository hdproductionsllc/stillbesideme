  <title>Order Confirmed | Still Beside Me</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/store.css">
  <style>
    .confirmation {
      max-width: 640px;
      margin: 0 auto;
      padding: var(--space-2xl) var(--space-md);
      text-align: center;
    }
    .confirmation-icon {
      font-size: 3rem;
      margin-bottom: var(--space-md);
    }
    .confirmation h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: var(--space-sm);
    }
    .confirmation .subtitle {
      color: var(--color-muted);
      font-size: 1.1rem;
      margin-bottom: var(--space-xl);
    }
    .order-details {
      background: var(--color-surface, #f9f6f2);
      border-radius: 12px;
      padding: var(--space-lg);
      text-align: left;
      margin-bottom: var(--space-xl);
    }
    .order-details h2 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: var(--space-md);
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--color-muted); }
    .detail-value { font-weight: 600; }
    .next-steps {
      text-align: left;
      margin-bottom: var(--space-xl);
    }
    .next-steps h2 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: var(--space-md);
    }
    .next-steps ol {
      padding-left: 1.5rem;
      line-height: 1.8;
    }
    .next-steps li { margin-bottom: 0.5rem; }
    .loading-state {
      padding: var(--space-2xl);
      color: var(--color-muted);
    }
    .error-state {
      padding: var(--space-2xl);
      color: var(--color-error, #c0392b);
    }

    /* --- "Remember them" opt-in card (shared with story.html) --- */
    #remember-card:empty { display: none; }
    .remember-card {
      border: 1px solid var(--color-border);
      background: var(--color-bg, #FAF8F5);
      border-radius: var(--radius, 8px);
      padding: var(--space-xl);
      margin: var(--space-xl) 0 0;
      text-align: left;
    }
    .remember-card h2 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.5rem;
      margin: 0 0 var(--space-xs);
    }
    .remember-card .rc-sub {
      color: var(--color-muted);
      line-height: 1.6;
      margin: 0 0 var(--space-lg);
    }
    .remember-card .rc-row { margin-bottom: var(--space-lg); }
    .remember-card .rc-legend {
      display: block;
      font-family: var(--font-body, sans-serif);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }
    .remember-card .rc-help { color: var(--color-muted); font-weight: 400; }
    .remember-card .rc-fields { display: flex; gap: var(--space-sm); flex-wrap: wrap; }
    .remember-card select,
    .remember-card input.rc-year {
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius, 8px);
      font-family: var(--font-body, sans-serif);
      font-size: 1rem;
      background: var(--color-surface, #fff);
      color: var(--color-primary);
    }
    .remember-card input.rc-year { width: 6.5rem; }
    .remember-card select:focus,
    .remember-card input.rc-year:focus { border-color: var(--color-warm); outline: none; }
    .remember-card .rc-actions {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      flex-wrap: wrap;
      margin-top: var(--space-md);
    }
    .remember-card .rc-decline {
      background: none; border: 0; padding: 0;
      color: var(--color-muted);
      font-family: var(--font-body, sans-serif);
      font-size: 0.95rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .remember-card .rc-decline:hover { color: var(--color-primary); }
    .remember-card .rc-status { margin: var(--space-md) 0 0; min-height: 1.2em; color: var(--color-success); }
    .remember-card .rc-muted-note { color: var(--color-muted); font-style: italic; margin: 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-logo">Still Beside Me</a>
    </div>
  </header>

  <main class="confirmation" id="confirmation">
    <div class="loading-state" id="loading">Loading your order details...</div>
  </main>

  <!-- Reusable "remember them" opt-in card. Embedded verbatim in story.html
       too, so both surfaces render an identical component. -->
  <script>
    window.SBMRememberCard = (function () {
      var MONTHS = ['January','February','March','April','May','June','July',
                    'August','September','October','November','December'];

      function pad2(n) { return String(n).padStart(2, '0'); }

      function el(tag, attrs, children) {
        var node = document.createElement(tag);
        if (attrs) Object.keys(attrs).forEach(function (k) {
          if (k === 'text') node.textContent = attrs[k];
          else node.setAttribute(k, attrs[k]);
        });
        (children || []).forEach(function (c) { if (c) node.appendChild(c); });
        return node;
      }

      // A month + day picker (and, for the passing day, an optional year).
      // Only month + day are required to save a date; the year matters only for
      // the anniversary of a passing.
      function buildDateRow(prefix, label, mmdd, year, withYear) {
        var monthSel = el('select', { id: prefix + '-month', 'aria-label': label + ' month' });
        monthSel.appendChild(el('option', { value: '', text: 'Month' }));
        MONTHS.forEach(function (name, i) {
          monthSel.appendChild(el('option', { value: pad2(i + 1), text: name }));
        });

        var daySel = el('select', { id: prefix + '-day', 'aria-label': label + ' day' });
        var DAYS_IN_MONTH = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        function fillDays(maxDay) {
          var keep = daySel.value;
          while (daySel.firstChild) daySel.removeChild(daySel.firstChild);
          daySel.appendChild(el('option', { value: '', text: 'Day' }));
          for (var d = 1; d <= maxDay; d++) {
            daySel.appendChild(el('option', { value: pad2(d), text: String(d) }));
          }
          // Keep the selection if it still exists in the shorter month.
          if (keep && Number(keep) <= maxDay) daySel.value = keep;
        }
        fillDays(31);
        // Impossible days (Feb 31) are also rejected server-side; trimming the
        // dropdown here just keeps the family from picking one to begin with.
        monthSel.addEventListener('change', function () {
          var m = Number(monthSel.value);
          fillDays(m >= 1 ? DAYS_IN_MONTH[m - 1] : 31);
        });

        if (mmdd && /^\d{2}-\d{2}$/.test(mmdd)) {
          monthSel.value = mmdd.slice(0, 2);
          daySel.value = mmdd.slice(3, 5);
        }

        var fields = [monthSel, daySel];
        if (withYear) {
          var nowY = new Date().getFullYear();
          var yearInput = el('input', {
            type: 'number', id: prefix + '-year', placeholder: 'Year',
            min: '1980', max: String(nowY), inputmode: 'numeric',
            'aria-label': label + ' year', class: 'rc-year'
          });
          if (year) yearInput.value = String(year);
          fields.push(yearInput);
        }

        var legend = el('label', { class: 'rc-legend', for: prefix + '-month' });
        legend.appendChild(document.createTextNode(label + ' '));
        legend.appendChild(el('span', { class: 'rc-help', text: '(optional)' }));

        return el('div', { class: 'rc-row' }, [legend, el('div', { class: 'rc-fields' }, fields)]);
      }

      // Read a row back into the shape the API expects: '' (leave as-is),
      // 'MM-DD', or 'YYYY-MM-DD' when a passing year is supplied.
      function readDate(prefix, withYear) {
        var m = document.getElementById(prefix + '-month');
        var d = document.getElementById(prefix + '-day');
        if (!m || !d || !m.value || !d.value) return '';
        var base = m.value + '-' + d.value;
        if (withYear) {
          var y = document.getElementById(prefix + '-year');
          if (y && /^\d{4}$/.test(y.value)) return y.value + '-' + base;
        }
        return base;
      }

      function render(host, opts) {
        if (!host) return;
        opts = opts || {};
        // Graceful degrade: with no vault token there is nothing to save to,
        // so the card simply doesn't appear.
        if (!opts.token) return;

        var dates = opts.dates || {};
        var name = (opts.petName && String(opts.petName).trim()) || 'them';

        // They already asked us to stop — honor it quietly, never re-invite.
        if (opts.optOut) {
          host.className = 'remember-card';
          host.innerHTML = '';
          host.appendChild(el('p', { class: 'rc-muted-note',
            text: 'Reminder notes are turned off. Their page will always be here whenever you’d like to visit.' }));
          return;
        }

        var editing = !!opts.optIn;
        host.className = 'remember-card';
        host.innerHTML = '';

        host.appendChild(el('h2', {
          text: editing
            ? 'We’ll remember ' + name + ' with you'
            : 'May we remember ' + name + ' with you?'
        }));
        host.appendChild(el('p', { class: 'rc-sub',
          text: editing
            ? 'These are the days we’ll reach out on. Add or adjust them whenever you like.'
            : 'Grief keeps its own calendar. If you’d like, we’ll send a quiet note on the days that meant something — and nothing else.' }));

        var form = el('form', { class: 'rc-form', novalidate: 'novalidate' });
        form.appendChild(buildDateRow('rc-birthday', 'Birthday', dates.birthday, null, false));
        form.appendChild(buildDateRow('rc-gotcha', 'Gotcha day', dates.gotchaDay, null, false));
        form.appendChild(buildDateRow('rc-passing', 'The day they crossed', dates.passingDay, dates.passingYear, true));

        var submit = el('button', { type: 'submit', class: 'btn btn-warm' });
        submit.textContent = editing ? 'Save these days' : 'Yes, remember them with me';

        var actions = el('div', { class: 'rc-actions' }, [submit]);
        if (!editing) {
          var decline = el('button', { type: 'button', class: 'rc-decline', text: 'No thanks' });
          decline.addEventListener('click', function () {
            host.className = 'remember-card';
            host.innerHTML = '';
          });
          actions.appendChild(decline);
        }
        form.appendChild(actions);

        var status = el('p', { class: 'rc-status', role: 'status', 'aria-live': 'polite' });
        form.appendChild(status);

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          submit.disabled = true;
          status.style.color = '';
          status.textContent = 'Saving…';

          var body = {
            birthday: readDate('rc-birthday', false),
            gotchaDay: readDate('rc-gotcha', false),
            passingDay: readDate('rc-passing', true),
            optIn: true
          };

          fetch('/api/vault/' + encodeURIComponent(opts.token) + '/dates', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          })
            .then(function (r) { if (!r.ok) throw new Error('save failed'); return r.json(); })
            .then(function () {
              host.className = 'remember-card';
              host.innerHTML = '';
              host.appendChild(el('h2', { text: 'Thank you' }));
              host.appendChild(el('p', { class: 'rc-sub',
                text: 'We’ll be thinking of ' + name + ' alongside you. You can change or stop these notes anytime.' }));
            })
            .catch(function () {
              submit.disabled = false;
              status.style.color = 'var(--color-error)';
              status.textContent = 'Something went wrong. Please try again.';
            });
        });

        host.appendChild(form);
      }

      return { render: render };
    })();
  </script>

  <script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const container = document.getElementById('confirmation');

    // Conversion tracking. Fires once per order (localStorage dedup keyed by
    // order id), never on refresh, and never breaks the page if it fails.
    // Readable GA4 item_name derived from the SKU so digital, print-only, and
    // framed rungs each report distinctly. Falls back gracefully.
    function itemNameForSku(sku) {
      if (!sku) return 'Pet Tribute';
      if (sku.indexOf('digital-') === 0) return 'Digital Keepsake';
      if (sku.indexOf('print-') === 0) return 'Print only (' + sku.replace('print-', '') + ')';
      if (sku.indexOf('framed-') === 0) return 'Framed Pet Tribute (' + sku.replace('framed-', '') + ')';
      return sku;
    }

    function trackPurchase(order) {
      try {
        if (!order || !order.orderId) return;
        const dedupKey = 'sbm_purchase_' + order.orderId;
        if (localStorage.getItem(dedupKey)) return;
        localStorage.setItem(dedupKey, '1');

        const value = order.totalCents ? Math.round(order.totalCents) / 100 : 0;
        const env = window.SBM_ENV || {};

        // GA4 purchase
        if (typeof gtag === 'function') {
          gtag('event', 'purchase', {
            transaction_id: order.orderId,
            value: value,
            currency: 'USD',
            items: order.sku ? [{
              item_id: order.sku,
              item_name: itemNameForSku(order.sku),
              price: value,
              quantity: 1,
            }] : [],
          });

          // Google Ads conversion (only when configured via /js/env.js)
          if (env.googleAdsId && env.googleAdsLabel) {
            gtag('config', env.googleAdsId);
            gtag('event', 'conversion', {
              send_to: env.googleAdsId + '/' + env.googleAdsLabel,
              value: value,
              currency: 'USD',
              transaction_id: order.orderId,
            });
          }
        }

        // Meta Pixel purchase (only when the pixel is live)
        if (env.metaPixelId && typeof fbq === 'function') {
          fbq('track', 'Purchase', { value: value, currency: 'USD' });
        }
      } catch (e) {
        // Tracking must never interfere with the confirmation page.
      }
    }

    if (!sessionId) {
      container.innerHTML = '<div class="error-state">No order found. <a href="/">Return to store</a></div>';
      return;
    }

    fetch(`/api/orders/confirmation?session_id=${encodeURIComponent(sessionId)}`)
      .then(r => r.json())
      .then(order => {
        if (order.error) {
          container.innerHTML = `
            <div class="confirmation-icon">&#10003;</div>
            <h1>Thank you for your order!</h1>
            <p class="subtitle">Your payment was received. We're preparing your tribute now.</p>
            <p style="color:var(--color-muted)">If you have questions, email us at support@stillbesideme.com</p>
            <p style="margin-top:var(--space-xl)"><a href="/" class="btn btn-warm">Return to Store</a></p>
          `;
          return;
        }

        const total = order.totalCents ? `$${(order.totalCents / 100).toFixed(2)}` : '';
        const shipping = order.shipping;
        const shippingHtml = shipping
          ? `<div class="detail-row"><span class="detail-label">Ships to</span><span class="detail-value">${shipping.name || ''}<br>${shipping.address1 || ''}${shipping.address2 ? ', ' + shipping.address2 : ''}<br>${shipping.city || ''}, ${shipping.state || ''} ${shipping.zip || ''}</span></div>`
          : '';

        container.innerHTML = `
          <div class="confirmation-icon">&#10003;</div>
          <h1>Thank you for your order</h1>
          <p class="subtitle">Your design proof is being created now. Check your email to review and approve it.</p>

          <div class="order-details">
            <h2>Order Summary</h2>
            <div class="detail-row">
              <span class="detail-label">Order</span>
              <span class="detail-value">${order.orderId.substring(0, 8).toUpperCase()}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Product</span>
              <span class="detail-value">${order.sku.replace('framed-', 'Framed ').replace('x', ' x ')}"</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Total</span>
              <span class="detail-value">${total}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Shipping</span>
              <span class="detail-value">Free</span>
            </div>
            ${shippingHtml}
            ${order.email ? `<div class="detail-row"><span class="detail-label">Confirmation sent to</span><span class="detail-value">${order.email}</span></div>` : ''}
          </div>

          <div class="next-steps">
            <h2>What happens next</h2>
            <ol>
              <li>We're creating your design proof now &mdash; <strong>check your email</strong></li>
              <li>Review and approve your proof (you'll get a link to see exactly how it will look)</li>
              <li>Once approved, printed on archival paper and professionally framed</li>
              <li>Shipped ready to hang, straight to the address you entered at checkout (8&ndash;12 business days after approval)</li>
            </ol>
            <p style="color:var(--color-muted);font-size:0.9rem;line-height:1.7;margin-top:var(--space-md)">
              If you ordered this as a gift, your confirmation email also includes a private tribute link that's yours to send &mdash; text it to them whenever it feels right, long before the frame arrives.
            </p>
          </div>

          <p style="display:flex;gap:var(--space-sm);justify-content:center;flex-wrap:wrap">
            ${order.proofToken
              ? `<a href="/order/${order.proofToken}" class="btn btn-warm">Track your order</a>`
              : `<a href="/order" class="btn btn-warm">Track your order</a>`}
            <a href="/" class="btn btn-link">Return to Store</a>
          </p>

          <section id="remember-card"></section>
        `;

        trackPurchase(order);

        // Gentle "remember them" opt-in. Renders only when the confirmation
        // payload carries the vault token (see report note); otherwise it
        // degrades to nothing so the page is never broken.
        var rememberHost = document.getElementById('remember-card');
        if (rememberHost && window.SBMRememberCard) {
          window.SBMRememberCard.render(rememberHost, {
            token: order.vaultToken || null,
            petName: order.petName || '',
            dates: order.vaultDates || {},
            context: 'confirmation'
          });
        }
      })
      .catch(() => {
        container.innerHTML = `
          <div class="confirmation-icon">&#10003;</div>
          <h1>Thank you for your order!</h1>
          <p class="subtitle">Your payment was received. We're preparing your tribute now.</p>
          <p style="margin-top:var(--space-xl)"><a href="/" class="btn btn-warm">Return to Store</a></p>
        `;
      });
  })();
  </script>
</body>
</html>
