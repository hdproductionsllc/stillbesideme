<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Tribute | Still Beside Me</title>
  <meta name="description" content="Someone had this made for you.">
  <!-- Tokenized and personal. Never indexed, never previewed by link unfurlers
       with real content — the sender chooses when and how to share it. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/store.css">
  <style>
    .tribute-page {
      max-width: 680px;
      margin: 0 auto;
      padding: var(--space-2xl) var(--space-md);
    }
    .tribute-brand {
      text-align: center;
      font-family: var(--font-display);
      letter-spacing: 0.18em;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: var(--space-2xl);
    }
    .tribute-brand a { color: inherit; text-decoration: none; }

    .tribute-intro {
      text-align: center;
      margin-bottom: var(--space-xl);
    }
    .tribute-intro h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.9rem;
      line-height: 1.3;
      margin-bottom: var(--space-sm);
    }
    .tribute-intro p {
      color: var(--color-muted);
      font-size: 1.05rem;
    }

    /* The sender's own words, set apart — this is the part that is from a
       person, not from us. */
    .tribute-note {
      background: var(--color-surface);
      border-radius: 12px;
      padding: var(--space-lg);
      margin-bottom: var(--space-xl);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .tribute-note-body {
      font-family: var(--font-display);
      font-size: 1.35rem;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .tribute-note-sign {
      margin-top: var(--space-md);
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.15rem;
      color: var(--color-muted);
    }

    .tribute-art {
      width: 100%;
      border-radius: 8px;
      box-shadow: var(--shadow-md, 0 8px 30px rgba(0,0,0,0.12));
      display: block;
      margin-bottom: var(--space-xl);
    }

    .tribute-poem {
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.25rem;
      line-height: 1.85;
      white-space: pre-wrap;
      margin-bottom: var(--space-xl);
    }
    .tribute-name {
      text-align: center;
      font-family: var(--font-display);
      font-size: 2.1rem;
      margin-bottom: var(--space-2xs, 4px);
    }
    .tribute-dates {
      text-align: center;
      color: var(--color-muted);
      font-size: 0.95rem;
      margin-bottom: var(--space-lg);
    }
    .tribute-rule {
      width: 60px;
      height: 1px;
      background: var(--color-accent, #B8975E);
      border: 0;
      margin: 0 auto var(--space-lg);
    }

    .tribute-pending {
      text-align: center;
      padding: var(--space-xl) var(--space-md);
      color: var(--color-muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .tribute-footer {
      text-align: center;
      border-top: 1px solid var(--color-border, #E8E4DF);
      padding-top: var(--space-lg);
      color: var(--color-muted);
      font-size: 0.9rem;
    }
    .tribute-footer a { color: inherit; }

    .tribute-error {
      text-align: center;
      padding: var(--space-2xl) var(--space-md);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="tribute-page">
    <div class="tribute-brand"><a href="/">Still Beside Me</a></div>

    <div id="loading" class="tribute-pending">Loading…</div>

    <div id="error" class="tribute-error" hidden>
      <h1>This tribute isn't available</h1>
      <p>The link may be mistyped or no longer active.</p>
      <p><a href="/">Visit Still Beside Me</a></p>
    </div>

    <main id="content" hidden>
      <div class="tribute-intro">
        <h1 id="intro-heading"></h1>
        <p id="intro-sub"></p>
      </div>

      <section id="note" class="tribute-note" hidden>
        <div class="tribute-note-body" id="note-body"></div>
        <div class="tribute-note-sign" id="note-sign" hidden></div>
      </section>

      <section id="artwork" hidden>
        <img id="art" class="tribute-art" alt="" />
      </section>

      <section id="pending" class="tribute-pending" hidden>
        It's being made by hand right now. Check back in a day or two — and it
        will arrive on paper before long.
      </section>

      <section id="poem-section" hidden>
        <hr class="tribute-rule" />
        <div class="tribute-name" id="subject-name"></div>
        <div class="tribute-dates" id="subject-dates"></div>
        <div class="tribute-poem" id="poem"></div>
      </section>

      <div class="tribute-footer">
        <p>Made by <a href="/">Still Beside Me</a> — memorial art, made personal.</p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var token = window.location.pathname.split('/').filter(Boolean).pop();

      var $ = function (id) { return document.getElementById(id); };
      function show(el) { el.hidden = false; }
      function hide(el) { el.hidden = true; }

      function fail() {
        hide($('loading'));
        show($('error'));
      }

      if (!token || token === 'tribute') { return fail(); }

      fetch('/api/tribute/' + encodeURIComponent(token))
        .then(function (r) {
          if (!r.ok) throw new Error('not found');
          return r.json();
        })
        .then(function (d) {
          hide($('loading'));
          show($('content'));

          var who = d.senderName || 'Someone';
          var name = d.subjectName;

          $('intro-heading').textContent = name
            ? who + ' had something made in memory of ' + name + '.'
            : who + ' had something made for you.';
          $('intro-sub').textContent = d.ready
            ? 'It’s on its way to you.'
            : 'It’s being made right now.';

          if (d.giftNote) {
            $('note-body').textContent = d.giftNote;
            show($('note'));
            if (d.senderName) {
              $('note-sign').textContent = '— ' + d.senderName;
              show($('note-sign'));
            }
          }

          if (d.ready && d.imageUrl) {
            var art = $('art');
            art.src = d.imageUrl;
            art.alt = name ? 'Tribute to ' + name : 'Tribute';
            show($('artwork'));

            if (d.poemText) {
              $('subject-name').textContent = name || '';
              var dates = [d.birthDate, d.passDate].filter(Boolean).join(' – ');
              $('subject-dates').textContent = dates;
              $('poem').textContent = d.poemText;
              show($('poem-section'));
            }
          } else {
            show($('pending'));
          }
        })
        .catch(fail);
    })();
  </script>
</body>
</html>
